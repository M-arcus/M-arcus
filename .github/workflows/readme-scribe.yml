name: Update README

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: "0 */1 * * *"

jobs:
    markscribe:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: "stable"

            - name: Install markscribe
              run: go install github.com/muesli/markscribe@master

            - name: Generate stats card
              uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
              with:
                  card: stats
                  options: username=M-arcus&hide=stars,issues&show=prs_merged,prs_merged_percentage,prs_commented,contributions,all_time_contribs&show_icons=true&disable_animations=true&theme=transparent
                  path: profile/stats.svg
                  token: ${{ secrets.STATS_GITHUB_TOKEN }}

            - name: Run markscribe
              run: "$(go env GOPATH)/bin/markscribe -write README.md templates/README.md.tpl"
              env:
                  GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

            - name: Generate PR.md
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  AUTHOR: ${{ github.repository_owner }}
              run: |
                  cutoff=$(date -u -d '1 month ago' +%Y-%m-%d)

                  gh search prs \
                      --author="$AUTHOR" \
                      --state=open \
                      --visibility=public \
                      --updated="<$cutoff" \
                      --limit 1000 \
                      --json repository,number,title,url,updatedAt,isDraft \
                      > prs.json

                  {
                      echo "# Inactive pull requests"
                      echo
                      echo "Open PRs by @$AUTHOR in public repositories without updates since $cutoff, most inactive first."
                      echo
                      echo "| Inactive | Last update | Repository | Pull request |"
                      echo "| ---: | --- | --- | --- |"
                      jq -r --argjson now "$(date -u +%s)" '
                          sort_by(.updatedAt)[]
                          | ((($now - (.updatedAt | fromdateiso8601)) / 86400) | floor) as $days
                          | "| \($days) days | \(.updatedAt[0:10]) | \(.repository.nameWithOwner) | [#\(.number) \(.title | gsub("\\|"; "\\|"))](\(.url))\(if .isDraft then " (draft)" else "" end) |"
                      ' prs.json
                  } > PR.md

                  rm prs.json

            - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  commit_message: Update generated README
                  branch: main
