name: Update README

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: "0 */1 * * *"

jobs:
    markscribe:
        runs-on: ubuntu-latest

        permissions:
            # Give the default GITHUB_TOKEN write permission to commit and push the
            # added or changed files to the repository.
            contents: write

        steps:
            - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: "stable"

            - name: Install markscribe
              run: go install github.com/muesli/markscribe@master

            - name: Generate stats card
              uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
              with:
                  card: stats
                  options: username=M-arcus&show=reviews%2Cdiscussions_started%2Cdiscussions_answered%2Cprs_merged%2Cprs_merged_percentage%2Cprs_commented%2Cprs_reviewed%2Cissues_commented%2Ccontributions%2Call_time_contribs&show_icons=true&include_all_commits=true&disable_animations=true&theme=transparent
                  path: profile/stats.svg
                  token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

            - name: Run markscribe
              run: "$(go env GOPATH)/bin/markscribe -write README.md templates/README.md.tpl"
              env:
                  GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

            - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  commit_message: Update generated README
                  branch: main
                  commit_user_name: readme-scribe 🤖
                  commit_user_email: actions@github.com
                  commit_author: readme-scribe 🤖 <actions@github.com>
